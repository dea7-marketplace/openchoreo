name: Dea7 controller patch

on:
  push:
    branches:
      - fix/rendered-release-resource-identity

permissions:
  contents: read

jobs:
  controller:
    name: Build and sign controller
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Test rendered release controller
        run: |
          make envtest
          KUBEBUILDER_ASSETS="$(bin/tools/setup-envtest use 1.36.0 --bin-dir bin/tools -p path)" \
            go test -race ./internal/controller/renderedrelease

      - name: Build controller
        run: make go.build-multiarch.manager GO_TARGET_PLATFORMS=linux/amd64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish controller image
        env:
          IMAGE: ghcr.io/dea7-marketplace/openchoreo-controller:${{ github.sha }}
        run: |
          docker buildx build \
            --file Dockerfile \
            --metadata-file /tmp/controller-metadata.json \
            --platform linux/amd64 \
            --provenance=mode=max \
            --push \
            --sbom=true \
            --tag "${IMAGE}" \
            .
          digest=$(jq -r '."containerimage.digest"' /tmp/controller-metadata.json)
          test -n "${digest}"
          test "${digest}" != "null"
          echo "CONTROLLER_DIGEST=${digest}" >> "${GITHUB_ENV}"
          echo "Published ${IMAGE%@*}@${digest}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign controller image
        env:
          IMAGE: ghcr.io/dea7-marketplace/openchoreo-controller
        run: |
          cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ github.sha }}" \
            "${IMAGE}@${CONTROLLER_DIGEST}"
